name: Deploy Grounding Engine Dev with Docker Compose

on:
  push:
    branches: [refactor/final-cleanup]

jobs:
  deploy-dev:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Upload code to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          source: '.'
          target: '/home/ubuntu/grounding-engine-dev'

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          APP_ENV: ${{ secrets.APP_ENV }}
          LOG_LEVEL: ${{ secrets.LOG_LEVEL }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          DOCUMENT_UPLOAD_MAX_BYTES: ${{ secrets.DOCUMENT_UPLOAD_MAX_BYTES }}
          INGESTION_AUTORUN_ENABLED: ${{ secrets.INGESTION_AUTORUN_ENABLED }}
          CHUNKING_STRATEGY: ${{ secrets.CHUNKING_STRATEGY }}
          CHUNK_MAX_TOKENS: ${{ secrets.CHUNK_MAX_TOKENS }}
          CHUNK_OVERLAP_TOKENS: ${{ secrets.CHUNK_OVERLAP_TOKENS }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ALEMBIC_DATABASE_URL: ${{ secrets.ALEMBIC_DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_COLLECTION: ${{ secrets.QDRANT_COLLECTION }}
          QDRANT_CHECK_COMPATIBILITY: ${{ secrets.QDRANT_CHECK_COMPATIBILITY }}
          EMBEDDING_BACKEND: ${{ secrets.EMBEDDING_BACKEND }}
          DENSE_EMBEDDING_DIMENSIONS: ${{ secrets.DENSE_EMBEDDING_DIMENSIONS }}
          RETRIEVAL_CANDIDATE_LIMIT: ${{ secrets.RETRIEVAL_CANDIDATE_LIMIT }}
          RETRIEVAL_OVERFETCH_FACTOR: ${{ secrets.RETRIEVAL_OVERFETCH_FACTOR }}
          RRF_SMOOTHING_CONSTANT: ${{ secrets.RRF_SMOOTHING_CONSTANT }}
          EVIDENCE_PACKAGE_LIMIT: ${{ secrets.EVIDENCE_PACKAGE_LIMIT }}
          S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
          S3_SECURE: ${{ secrets.S3_SECURE }}
          GENERATOR_BACKEND: ${{ secrets.GENERATOR_BACKEND }}
          PROVIDER_MAX_RETRIES: ${{ secrets.PROVIDER_MAX_RETRIES }}
          PROVIDER_RETRY_BACKOFF_MS: ${{ secrets.PROVIDER_RETRY_BACKOFF_MS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_BASE_URL: ${{ secrets.GEMINI_BASE_URL }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          GEMINI_EMBEDDING_MODEL: ${{ secrets.GEMINI_EMBEDDING_MODEL }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          API_KEY_SALT: ${{ secrets.API_KEY_SALT }}
          TRACE_ENCRYPTION_KEY: ${{ secrets.TRACE_ENCRYPTION_KEY }}
          OTEL_EXPORTER_ENDPOINT: ${{ secrets.OTEL_EXPORTER_ENDPOINT }}
          PROMETHEUS_ENABLED: ${{ secrets.PROMETHEUS_ENABLED }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          ENTERPRISE_ENABLED: ${{ secrets.ENTERPRISE_ENABLED }}
          ENTERPRISE_TRACE_METADATA_ENABLED: ${{ secrets.ENTERPRISE_TRACE_METADATA_ENABLED }}
          ENTERPRISE_AUTO_ROUTING_ENABLED: ${{ secrets.ENTERPRISE_AUTO_ROUTING_ENABLED }}
          ENTERPRISE_RERANKER_ENABLED: ${{ secrets.ENTERPRISE_RERANKER_ENABLED }}
          ENTERPRISE_RERANKER_BACKEND: ${{ secrets.ENTERPRISE_RERANKER_BACKEND }}
          ENTERPRISE_RERANKER_CANDIDATE_LIMIT: ${{ secrets.ENTERPRISE_RERANKER_CANDIDATE_LIMIT }}
          ENTERPRISE_TEMPORAL_SCORING_ENABLED: ${{ secrets.ENTERPRISE_TEMPORAL_SCORING_ENABLED }}
          CRITICAL_ENABLED: ${{ secrets.CRITICAL_ENABLED }}
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
          CORS_ALLOWED_ORIGINS: ${{ secrets.CORS_ALLOWED_ORIGINS }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          command_timeout: 25m
          timeout: 60s
          envs: APP_ENV,LOG_LEVEL,API_BASE_URL,DOCUMENT_UPLOAD_MAX_BYTES,INGESTION_AUTORUN_ENABLED,CHUNKING_STRATEGY,CHUNK_MAX_TOKENS,CHUNK_OVERLAP_TOKENS,DATABASE_URL,ALEMBIC_DATABASE_URL,REDIS_URL,QDRANT_URL,QDRANT_COLLECTION,QDRANT_CHECK_COMPATIBILITY,EMBEDDING_BACKEND,DENSE_EMBEDDING_DIMENSIONS,RETRIEVAL_CANDIDATE_LIMIT,RETRIEVAL_OVERFETCH_FACTOR,RRF_SMOOTHING_CONSTANT,EVIDENCE_PACKAGE_LIMIT,S3_ENDPOINT_URL,S3_BUCKET,S3_ACCESS_KEY,S3_SECRET_KEY,S3_SECURE,GENERATOR_BACKEND,PROVIDER_MAX_RETRIES,PROVIDER_RETRY_BACKOFF_MS,GEMINI_API_KEY,GEMINI_BASE_URL,GEMINI_MODEL,GEMINI_EMBEDDING_MODEL,JWT_SECRET_KEY,API_KEY_SALT,TRACE_ENCRYPTION_KEY,OTEL_EXPORTER_ENDPOINT,PROMETHEUS_ENABLED,GOOGLE_CLIENT_ID,GOOGLE_CLIENT_SECRET,ENTERPRISE_ENABLED,ENTERPRISE_TRACE_METADATA_ENABLED,ENTERPRISE_AUTO_ROUTING_ENABLED,ENTERPRISE_RERANKER_ENABLED,ENTERPRISE_RERANKER_BACKEND,ENTERPRISE_RERANKER_CANDIDATE_LIMIT,ENTERPRISE_TEMPORAL_SCORING_ENABLED,CRITICAL_ENABLED,FRONTEND_URL,CORS_ALLOWED_ORIGINS,RESEND_API_KEY,POSTGRES_DB,POSTGRES_USER,POSTGRES_PASSWORD
          script: |
            set -euo pipefail

            APP_DIR="$HOME/grounding-engine-dev"
            cd "$APP_DIR"

            ENV_KEYS="APP_ENV LOG_LEVEL API_BASE_URL DOCUMENT_UPLOAD_MAX_BYTES INGESTION_AUTORUN_ENABLED CHUNKING_STRATEGY CHUNK_MAX_TOKENS CHUNK_OVERLAP_TOKENS DATABASE_URL ALEMBIC_DATABASE_URL REDIS_URL QDRANT_URL QDRANT_COLLECTION QDRANT_CHECK_COMPATIBILITY EMBEDDING_BACKEND DENSE_EMBEDDING_DIMENSIONS RETRIEVAL_CANDIDATE_LIMIT RETRIEVAL_OVERFETCH_FACTOR RRF_SMOOTHING_CONSTANT EVIDENCE_PACKAGE_LIMIT S3_ENDPOINT_URL S3_BUCKET S3_ACCESS_KEY S3_SECRET_KEY S3_SECURE GENERATOR_BACKEND PROVIDER_MAX_RETRIES PROVIDER_RETRY_BACKOFF_MS GEMINI_API_KEY GEMINI_BASE_URL GEMINI_MODEL GEMINI_EMBEDDING_MODEL JWT_SECRET_KEY API_KEY_SALT TRACE_ENCRYPTION_KEY OTEL_EXPORTER_ENDPOINT PROMETHEUS_ENABLED GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET ENTERPRISE_ENABLED ENTERPRISE_TRACE_METADATA_ENABLED ENTERPRISE_AUTO_ROUTING_ENABLED ENTERPRISE_RERANKER_ENABLED ENTERPRISE_RERANKER_BACKEND ENTERPRISE_RERANKER_CANDIDATE_LIMIT ENTERPRISE_TEMPORAL_SCORING_ENABLED CRITICAL_ENABLED FRONTEND_URL CORS_ALLOWED_ORIGINS RESEND_API_KEY POSTGRES_DB POSTGRES_USER POSTGRES_PASSWORD"

            : > .env

            for key in $ENV_KEYS; do
              if [ -z "${!key+x}" ]; then
                echo "Missing required environment variable: $key" >&2
                exit 1
              fi
              printf '%s=%s\n' "$key" "${!key}" >> .env
            done

            COMPOSE_FILE="docker-compose.deploy.dev.yml"

            docker compose -f "$COMPOSE_FILE" down || true
            docker image prune -f || true
            docker builder prune -f || true
            docker compose -f "$COMPOSE_FILE" build backend

            docker compose -f "$COMPOSE_FILE" up -d postgres redis qdrant minio --wait
            docker compose -f "$COMPOSE_FILE" run --rm --no-deps backend python -m alembic upgrade head
            docker compose -f "$COMPOSE_FILE" up -d --wait
