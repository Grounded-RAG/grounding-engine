name: Backend CI

on:
  push:
  pull_request:

jobs:
  foundation-check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: grounded
          POSTGRES_USER: grounded
          POSTGRES_PASSWORD: grounded
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U grounded -d grounded"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://grounded:grounded@localhost:5432/grounded
      ALEMBIC_DATABASE_URL: postgresql+psycopg://grounded:grounded@localhost:5432/grounded
      API_KEY_SALT: ci-api-key-salt
      S3_ENDPOINT_URL: http://localhost:9000
      S3_BUCKET: grounded-documents
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_SECURE: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run foundation checks
        run: make ci
