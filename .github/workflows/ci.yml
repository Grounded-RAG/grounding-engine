name: Backend CI

on:
  push:
  pull_request:

jobs:
  structure-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile backend sources
        run: python -m compileall backend/app backend/tests
